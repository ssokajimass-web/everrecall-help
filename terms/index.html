<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<style>
:root {
  color-scheme: light dark;
  --bg: #FAF9F6;
  --surface: #F0EDE6;
  --surface-2: #E5E2DA;
  --text-primary: #2C2A25;
  --text-secondary: #6B6860;
  --text-tertiary: #9E9A92;
  --accent: #3D7A56;
  --accent-subtle: rgba(61, 122, 86, 0.12);
  --warning-subtle: rgba(200, 170, 90, 0.16);
  --border: rgba(44, 42, 37, 0.12);
  --max-width-text: 45rem;
  --max-width-page: 75rem;
  --space-xs: 0.5rem;
  --space-s: 1rem;
  --space-m: 1.5rem;
  --space-l: 2.5rem;
  --space-xl: 5rem;
  --space-xxl: 8rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1C1C1E;
    --surface: #2C2C2E;
    --surface-2: #3A3A3C;
    --text-primary: #E8E6E1;
    --text-secondary: #A0A09B;
    --text-tertiary: #6C6C6A;
    --accent: #5E9E78;
    --accent-subtle: rgba(94, 158, 120, 0.16);
    --warning-subtle: rgba(200, 170, 90, 0.14);
    --border: rgba(232, 230, 225, 0.14);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-primary);
  font-family: ui-sans-serif, -apple-system, "Hiragino Sans", "Noto Sans", sans-serif;
  font-size: 1rem;
  line-height: 1.75;
}
h1, h2, h3 {
  font-family: ui-serif, Georgia, "Hiragino Mincho ProN", serif;
  font-weight: 700;
  line-height: 1.3;
  color: var(--text-primary);
}
h1 { font-size: clamp(2rem, 1.5rem + 2vw, 3.25rem); font-weight: 800; margin: 0 0 var(--space-s); }
h2 { font-size: clamp(1.375rem, 1.2rem + 0.6vw, 1.75rem); margin: 0 0 var(--space-s); }
h3 { font-size: 1.125rem; margin: var(--space-m) 0 var(--space-s); }
p { margin: 0 0 var(--space-s); max-width: 65ch; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 0.15em; }
ul { margin: 0 0 var(--space-s); padding-left: 1.25em; }
li { margin-bottom: 0.4em; }
.page {
  max-width: var(--max-width-page);
  margin: 0 auto;
  padding: 0 clamp(1rem, 4vw, 2.5rem);
}
.container {
  max-width: var(--max-width-text);
  margin: 0 auto;
  padding: var(--space-l) clamp(1rem, 4vw, 2.5rem) var(--space-xl);
}
header.site-header {
  border-bottom: 1px solid var(--border);
}
.site-header-inner {
  max-width: var(--max-width-page);
  margin: 0 auto;
  padding: var(--space-m) clamp(1rem, 4vw, 2.5rem);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-m);
}
.wordmark {
  font-family: ui-serif, Georgia, "Hiragino Mincho ProN", serif;
  font-weight: 800;
  font-size: 1.125rem;
  color: var(--text-primary);
  text-decoration: none;
  letter-spacing: 0.01em;
}
.header-nav { display: flex; align-items: center; gap: var(--space-m); flex-wrap: wrap; }
.header-nav a { color: var(--text-secondary); font-size: 0.9375rem; text-decoration: none; }
.header-nav a:hover { color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.lang-select {
  font: inherit;
  font-size: 0.875rem;
  color: var(--text-tertiary);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.3em 0.9em;
  cursor: pointer;
}
.lang-select:hover, .lang-select:focus-visible { color: var(--accent); border-color: var(--accent); }
.hero {
  display: grid;
  grid-template-columns: 3fr 2fr;
  gap: var(--space-xl);
  align-items: start;
  padding: var(--space-xxl) 0 var(--space-xl);
}
@media (max-width: 48rem) {
  .hero { grid-template-columns: 1fr; padding: var(--space-xl) 0; gap: var(--space-l); }
}
.eyebrow {
  display: inline-block;
  font-size: 0.8125rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: var(--space-s);
}
.hero-lede { font-size: 1.125rem; color: var(--text-secondary); max-width: 40ch; }
.app-card-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-s); }
.app-card {
  display: block;
  padding: var(--space-m);
  border: 1px solid var(--border);
  border-radius: 1rem;
  background: var(--surface);
  text-decoration: none;
  color: var(--text-primary);
}
.app-card.is-live:hover { border-color: var(--accent); }
.app-card.is-pending { opacity: 0.7; cursor: default; }
.app-card .app-name { display: block; font-weight: 700; font-size: 1.0625rem; font-family: ui-serif, Georgia, serif; }
.app-card .app-desc { display: block; margin-top: 0.25em; font-size: 0.875rem; color: var(--text-secondary); }
.app-card .app-status { display: inline-block; margin-top: 0.6em; font-size: 0.75rem; color: var(--text-tertiary); }
section.block {
  padding: var(--space-xl) 0;
  border-top: 1px solid var(--border);
}
section.block:first-of-type { border-top: none; }
.badge-placeholder {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  border: 1px dashed var(--border);
  border-radius: 0.75rem;
  padding: var(--space-s) var(--space-m);
  color: var(--text-tertiary);
  font-size: 0.875rem;
  margin: var(--space-s) 0 var(--space-m);
}
.faq-list { list-style: none; margin: 0; padding: 0; }
.faq-item { padding: var(--space-m) 0; border-top: 1px solid var(--border); }
.faq-item:first-child { border-top: none; padding-top: 0; }
.faq-item dt { font-weight: 700; margin-bottom: 0.4em; }
.faq-item dd { margin: 0; color: var(--text-secondary); }
.legal-section { margin-bottom: var(--space-xl); }
.legal-meta { color: var(--text-tertiary); font-size: 0.875rem; }
footer.site-footer {
  border-top: 1px solid var(--border);
  margin-top: var(--space-xl);
}
.site-footer-inner {
  max-width: var(--max-width-page);
  margin: 0 auto;
  padding: var(--space-l) clamp(1rem, 4vw, 2.5rem) var(--space-xl);
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-m) var(--space-l);
  align-items: center;
  justify-content: space-between;
  color: var(--text-tertiary);
  font-size: 0.875rem;
}
.footer-links { display: flex; gap: var(--space-m); flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
.footer-links a { color: var(--text-secondary); text-decoration: none; }
.footer-links a:hover { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .stagger > * { animation: fade-in 0.4s ease both; }
  .stagger > *:nth-child(1) { animation-delay: 0.02s; }
  .stagger > *:nth-child(2) { animation-delay: 0.08s; }
  .stagger > *:nth-child(3) { animation-delay: 0.14s; }
  .stagger > *:nth-child(4) { animation-delay: 0.2s; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<div class="container">
<h1>Terms of Service</h1>
<p>Choose your language / 言語を選んでください</p>
<ul class="footer-links" style="flex-direction: column;">
<li><a href="ja/terms/">日本語</a></li>
<li><a href="en/terms/">English</a></li>
<li><a href="zh-Hans/terms/">简体中文</a></li>
<li><a href="zh-Hant/terms/">繁體中文</a></li>
<li><a href="ko/terms/">한국어</a></li>
<li><a href="de/terms/">Deutsch</a></li>
<li><a href="fr/terms/">Français</a></li>
<li><a href="es/terms/">Español</a></li>
<li><a href="pt/terms/">Português</a></li>
<li><a href="ru/terms/">Русский</a></li>
<li><a href="ar/terms/">العربية</a></li>
<li><a href="vi/terms/">Tiếng Việt</a></li>
</ul>
</div>
<script>
(function () {
  var supported = ["ja","en","zh-Hans","zh-Hant","ko","de","fr","es","pt","ru","ar","vi"];
  // "zh" だけでは簡体字/繁体字を判別できないため、地域サブタグ/スクリプトサブタグを見て振り分ける。
  function normalize(tag) {
    var lower = tag.toLowerCase();
    if (lower.indexOf("zh") === 0) {
      if (lower.indexOf("hant") !== -1 || lower.indexOf("-tw") !== -1 || lower.indexOf("-hk") !== -1 || lower.indexOf("-mo") !== -1) {
        return "zh-Hant";
      }
      return "zh-Hans";
    }
    return tag.split("-")[0];
  }
  var nav = (navigator.languages || [navigator.language || "en"]);
  for (var i = 0; i < nav.length; i++) {
    var base = normalize(nav[i]);
    if (supported.indexOf(base) !== -1) {
      location.replace(base + "/terms/");
      return;
    }
  }
  location.replace("en/terms/");
})();
</script>
</body>
</html>
